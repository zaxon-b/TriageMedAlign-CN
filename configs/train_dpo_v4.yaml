### model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
adapter_name_or_path: saves/qwen2.5-7b/lora/exp1_lora_r8_all

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
pref_beta: 2.0
pref_loss: sigmoid
pref_ftx: 0.1

### dataset
dataset: dpo_medical_triage_v4
template: qwen
cutoff_len: 512
val_size: 0.1
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: saves/qwen2.5-7b/lora/dpo_v4_r8_beta2_3epoch
logging_steps: 10
save_steps: 200
eval_steps: 200
eval_strategy: steps
plot_loss: true
overwrite_output_dir: true
report_to: none
run_name: dpo_v4_r8_beta2_ftx01

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1e-06
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: fa2
